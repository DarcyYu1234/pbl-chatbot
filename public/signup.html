<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PBL 探究助手 · 学生注册</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .signup .card { width: 400px; }
    .signup .err-ok { color: #15803d; }
    .signup .row-back {
      margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted);
    }
    .signup .row-back a { color: var(--primary); }
  </style>
</head>
<body class="login signup">
  <div class="card">
    <h1>学生自助注册</h1>
    <p class="muted">用你自己的邮箱注册一个账号，注册后用邮箱和密码登录。</p>

    <input type="email"    id="email"           placeholder="邮箱（用于登录）"     autocomplete="username">
    <input type="password" id="password"        placeholder="密码（≥ 6 位）"      autocomplete="new-password">
    <input type="password" id="passwordConfirm" placeholder="再次输入密码"          autocomplete="new-password">
    <input type="text"     id="displayName"     placeholder="姓名（如：张三）">
    <input type="text"     id="classLabel"      placeholder="班级（如：高一1班，可选）">

    <button id="signupBtn">注册账号</button>
    <p class="err" id="msg"></p>

    <p class="row-back">
      已有账号？<a href="/">返回登录</a>
    </p>
  </div>

  <script type="module" src="/assets/signup.js"></script>
</body>
</html>
